name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: build unsigned ipa (arm64)
        run: |
          chmod +x ci/build_ipa_macos.sh
          ARCH=arm64 OUT_NAME=App ./ci/build_ipa_macos.sh

      - name: build unsigned ipa (arm64e)
        run: |
          ARCH=arm64e OUT_NAME=App-arm64e ./ci/build_ipa_macos.sh

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-ipa
          path: |
            dist/App.ipa
            dist/App-arm64e.ipa
          if-no-files-found: error