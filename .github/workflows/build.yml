name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: build unsigned ipa
        run: |
          chmod +x ci/build_ipa_macos.sh
          ./ci/build_ipa_macos.sh

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-ipa
          path: dist/App.ipa
          if-no-files-found: error